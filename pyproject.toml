[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hillock"
version = "0.6.1"
description = "A lightweight, 100% local neuro-symbolic memory engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "pypdf>=3.17.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "fastcoref>=2.1.0",
    "glirel>=0.1.0",
    "sentence-transformers>=2.2.2",
    "spacy>=3.5.0",
    "loguru",
    "tiktoken",
    "sentencepiece",
    "protobuf"
]

[project.scripts]
hillock = "main:run_cli"